<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>案02 — 準備から始める | PerfectPodcast</title>
  <link rel="stylesheet" href="./session-layouts.css">
</head>
<body class="layout-two">
  <main class="page">
    <header class="topbar"><a class="brand" href="./index.html"><span class="brand-mark">P</span><span>perfect<span class="brand-light">podcast</span></span></a><span class="demo-label">案 02 / Guided</span></header>
    <section class="intro"><p class="eyebrow">Your recording desk</p><h1>いい声を、残そう。</h1><p class="subtitle">名前とマイクを確認して、スタジオを開きます。</p></section>
    <section class="panel setup" aria-labelledby="setup-title">
      <h2 class="panel-title" id="setup-title">収録の準備 <small>01 — まずは入力を確認</small></h2>
      <div class="fields">
        <label class="field">あなたの名前<input value="山田 花子" aria-label="あなたの名前"></label>
        <label class="field">録音マイク<select aria-label="録音マイク"><option>MacBook Proのマイク</option></select></label>
      </div>
      <button class="primary" type="button">スタジオを開く <span aria-hidden="true">→</span></button>
    </section>
    <section class="sessions" aria-labelledby="sessions-title">
      <h2 class="panel-title" id="sessions-title">保存したセッション <small>最近使った順</small></h2>
      <article class="session"><div><h3 class="session-name">秋の新作を語る</h3><p class="session-date">2026年10月7日 · 山田 花子</p></div><div class="session-meta"><span class="metric">4 takes</span><span class="metric">38.4 MB</span></div><a class="open-link" href="#session-1">開く →</a></article>
      <article class="session"><div><h3 class="session-name">番組#24 ゲスト回</h3><p class="session-date">2026年10月2日 · 山田 花子</p></div><div class="session-meta"><span class="metric">7 takes</span><span class="metric">62.1 MB</span></div><a class="open-link" href="#session-2">開く →</a></article>
      <article class="session"><div><h3 class="session-name">オープニング録り直し</h3><p class="session-date">2026年9月28日 · 山田 花子</p></div><div class="session-meta"><span class="metric">2 takes</span><span class="metric">12.7 MB</span></div><a class="open-link" href="#session-3">開く →</a></article>
    </section>
    <nav class="sample-nav" aria-label="デザイン案の切り替え"><span>他の案</span><a href="./session-layout-01.html">01</a><a href="./session-layout-02.html" aria-current="page">02</a><a href="./session-layout-03.html">03</a><a href="./session-layout-04.html">04</a><a href="./session-layout-05.html">05</a></nav>
  </main>
