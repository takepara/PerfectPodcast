<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101318">
  <title>PerfectPodcast — ログイン</title>
  <link rel="stylesheet" href="./recorder.css">
</head>
<body>
  <div class="top-rule" aria-hidden="true"></div>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="PerfectPodcast ホーム">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span>perfect<span class="brand-light">podcast</span></span>
      </a>
    </header>
    <section class="panel login-panel" aria-labelledby="loginHeading">
      <div class="login-art" aria-hidden="true">
        <svg viewBox="0 0 240 64" fill="none">
          <path d="M8 32h12m8-8v16m12-25v34m12-40v46m12-33v20m12-8v-4m12-16v36m12-48v60m12-46v32m12-22v12m12-26v40m12-46v52m12-38v24m12-18v12m12-28v44m12-34v24m12-16v8m12-4h12" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <span class="login-eyebrow">PerfectPodcast</span>
      </div>
      <h1 id="loginHeading" class="login-heading">高音質ポッドキャスト収録</h1>
      <p class="login-description">参加者ごとの音声を24-bit / 48 kHzで端末に録音。通話音声とは別に、WAVで保存できます。</p>
      <div class="login-features" aria-label="収録機能">
        <span>ゲストを招待</span><span>端末に録音</span><span>WAVで保存</span>
      </div>
      <div class="login-action">
        <h2>スタジオを開く</h2>
        <p>ホストとして収録を始めるには、ログインしてください。</p>
        <p id="status" class="login-status" role="status" aria-live="polite">認証設定を確認しています…</p>
        <button id="loginButton" class="button button-primary" type="button" hidden>ログイン</button>
      </div>
      <p class="login-guest-note">ゲストの方は、ホストから届いた招待リンクで参加できます。ログインは不要です。</p>
    </section>
  </main>
  <script>
    window.setTimeout(() => {
      const status = document.getElementById('status');
      if (status?.textContent === '認証設定を確認しています…') {
        status.textContent = '認証の初期化がタイムアウトしました。通信状態を確認してページを再読み込みしてください。';
        status.dataset.kind = 'error';
      }
    }, 12000);
  </script>
  <script type="module">
    import {
      establishHostSession,
      getAuth0Client,
      getHostSession,
      safeReturnTo
    } from './auth-client.bundle.js';

    const loginButton = document.getElementById('loginButton');
    const status = document.getElementById('status');
    const params = new URLSearchParams(window.location.search);
    const setStatus = (message, isError = false) => {
      status.textContent = message;
      status.dataset.kind = isError ? 'error' : 'idle';
    };
    const waitFor = (promise, message, timeoutMs = 8000) => {
      let timeoutId;
      const timeout = new Promise((_, reject) => {
        timeoutId = window.setTimeout(() => reject(new Error(message)), timeoutMs);
      });
      return Promise.race([promise, timeout]).finally(() => window.clearTimeout(timeoutId));
    };

    async function initializeLogin() {
      let client;
      try {
        client = await waitFor(getAuth0Client(), 'Auth0設定の読み込みがタイムアウトしました。');
      } catch (error) {
        setStatus(error.message, true);
        return;
      }
      try {
        if (params.has('error')) {
          const code = params.get('error');
          const description = params.get('error_description');
          const details = [code, description].filter(Boolean).join(': ').slice(0, 360);
          throw new Error(details
            ? `Auth0からエラーが返されました: ${details}`
            : 'Auth0から詳細のないエラーが返されました。');
        }
        if (params.has('code') && params.has('state')) {
          const { appState } = await waitFor(
            client.handleRedirectCallback(),
            'Auth0のcallback処理がタイムアウトしました。',
            10000
          );
          await waitFor(
            establishHostSession(client),
            'Workerへの認証セッション作成がタイムアウトしました。'
          );
          window.location.replace(safeReturnTo(appState?.returnTo));
          return;
        }
        if (await waitFor(getHostSession(), 'Workerの認証状態確認がタイムアウトしました。')) {
          window.location.replace(safeReturnTo(params.get('returnTo')));
          return;
        }
      } catch (error) {
        setStatus(error.message, true);
      }
      if (!status.dataset.kind || status.dataset.kind !== 'error') {
        if (params.get('logout') === '1') setStatus('ログアウトしました。');
        else setStatus('');
      }
      loginButton.hidden = false;
      loginButton.addEventListener('click', async () => {
        loginButton.disabled = true;
        try {
          await client.loginWithRedirect({
            authorizationParams: { prompt: 'login' },
            appState: { returnTo: safeReturnTo(params.get('returnTo')) }
          });
        } catch (error) {
          setStatus(error.message, true);
          loginButton.disabled = false;
        }
      }, { once: true });
    }

    void initializeLogin();
  </script>
</body>
</html>
