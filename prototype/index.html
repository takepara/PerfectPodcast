<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PerfectPodcast — ログイン</title>
  <style>
    :root {
      color-scheme: light dark;
      font: 16px/1.6 system-ui, sans-serif;
      --border: color-mix(in srgb, CanvasText 22%, transparent);
      --accent: #16794b;
      --danger: #a52b2b;
    }

    body {
      box-sizing: border-box;
      display: grid;
      min-height: 100vh;
      place-items: center;
      margin: 0;
      padding: 24px;
    }

    main {
      width: min(100%, 440px);
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    button {
      min-height: 44px;
      padding: 8px 16px;
      border: 0;
      border-radius: 8px;
      color: white;
      background: var(--accent);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #status {
      min-height: 3em;
    }

    #status[data-kind="error"] {
      color: var(--danger);
    }
  </style>
</head>
<body>
  <main>
    <h1>PerfectPodcast</h1>
    <p>収録ホストとして続けるには、許可されたAuth0アカウントでログインしてください。招待されたゲストは招待リンクからログインなしで参加できます。</p>
    <p id="status" role="status" aria-live="polite">認証設定を確認しています…</p>
    <button id="loginButton" type="button" hidden>Auth0でログイン</button>
  </main>
  <script>
    window.setTimeout(() => {
      const status = document.getElementById('status');
      if (status?.textContent === '認証設定を確認しています…') {
        status.textContent = '認証の初期化がタイムアウトしました。通信状態を確認してページを再読み込みしてください。';
        status.dataset.kind = 'error';
      }
    }, 12000);
  </script>
  <script type="module">
    import {
      establishHostSession,
      getAuth0Client,
      getHostSession,
      safeReturnTo
    } from './auth-client.bundle.js';

    const loginButton = document.getElementById('loginButton');
    const status = document.getElementById('status');
    const params = new URLSearchParams(window.location.search);
    const setStatus = (message, isError = false) => {
      status.textContent = message;
      status.dataset.kind = isError ? 'error' : 'idle';
    };
    const waitFor = (promise, message, timeoutMs = 8000) => {
      let timeoutId;
      const timeout = new Promise((_, reject) => {
        timeoutId = window.setTimeout(() => reject(new Error(message)), timeoutMs);
      });
      return Promise.race([promise, timeout]).finally(() => window.clearTimeout(timeoutId));
    };

    async function initializeLogin() {
      let client;
      try {
        client = await waitFor(getAuth0Client(), 'Auth0設定の読み込みがタイムアウトしました。');
      } catch (error) {
        setStatus(error.message, true);
        return;
      }
      try {
        if (params.has('error')) {
          const code = params.get('error');
          const description = params.get('error_description');
          const details = [code, description].filter(Boolean).join(': ').slice(0, 360);
          throw new Error(details
            ? `Auth0からエラーが返されました: ${details}`
            : 'Auth0から詳細のないエラーが返されました。');
        }
        if (params.has('code') && params.has('state')) {
          const { appState } = await waitFor(
            client.handleRedirectCallback(),
            'Auth0のcallback処理がタイムアウトしました。',
            10000
          );
          await waitFor(
            establishHostSession(client),
            'Workerへの認証セッション作成がタイムアウトしました。'
          );
          window.location.replace(safeReturnTo(appState?.returnTo));
          return;
        }
        if (await waitFor(getHostSession(), 'Workerの認証状態確認がタイムアウトしました。')) {
          window.location.replace(safeReturnTo(params.get('returnTo')));
          return;
        }
      } catch (error) {
        setStatus(error.message, true);
      }
      if (!status.dataset.kind || status.dataset.kind !== 'error') {
        if (params.get('logout') === '1') setStatus('ログアウトしました。');
        else setStatus('ログインして収録ホストとして続行してください。');
      }
      loginButton.hidden = false;
      loginButton.addEventListener('click', async () => {
        loginButton.disabled = true;
        try {
          await client.loginWithRedirect({
            authorizationParams: { prompt: 'login' },
            appState: { returnTo: safeReturnTo(params.get('returnTo')) }
          });
        } catch (error) {
          setStatus(error.message, true);
          loginButton.disabled = false;
        }
      }, { once: true });
    }

    void initializeLogin();
  </script>
</body>
</html>
