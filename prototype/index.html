<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PerfectPodcast — ログイン</title>
  <style>
    :root {
      color-scheme: light dark;
      font: 16px/1.6 system-ui, sans-serif;
      --border: color-mix(in srgb, CanvasText 22%, transparent);
      --accent: #16794b;
      --danger: #a52b2b;
    }

    body {
      box-sizing: border-box;
      display: grid;
      min-height: 100vh;
      place-items: center;
      margin: 0;
      padding: 24px;
    }

    main {
      width: min(100%, 440px);
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    button {
      min-height: 44px;
      padding: 8px 16px;
      border: 0;
      border-radius: 8px;
      color: white;
      background: var(--accent);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #status {
      min-height: 3em;
    }

    #status[data-kind="error"] {
      color: var(--danger);
    }
  </style>
</head>
<body>
  <main>
    <h1>PerfectPodcast</h1>
    <p>収録ホストとして続けるには、許可されたAuth0アカウントでログインしてください。招待されたゲストは招待リンクからログインなしで参加できます。</p>
    <p id="status" role="status" aria-live="polite">認証設定を確認しています…</p>
    <button id="loginButton" type="button" hidden>Auth0でログイン</button>
  </main>
  <script type="module">
    import {
      establishHostSession,
      getAuth0Client,
      getHostSession,
      safeReturnTo
    } from './auth-client.bundle.js';

    const loginButton = document.getElementById('loginButton');
    const status = document.getElementById('status');
    const params = new URLSearchParams(window.location.search);
    const setStatus = (message, isError = false) => {
      status.textContent = message;
      status.dataset.kind = isError ? 'error' : 'idle';
    };

    async function initializeLogin() {
      let client;
      try {
        client = await getAuth0Client();
      } catch (error) {
        setStatus(error.message, true);
        return;
      }
      try {
        if (params.has('error')) {
          throw new Error('Auth0ログインに失敗しました。時間をおいて再度お試しください。');
        }
        if (params.has('code') && params.has('state')) {
          const { appState } = await client.handleRedirectCallback();
          await establishHostSession(client);
          window.location.replace(safeReturnTo(appState?.returnTo));
          return;
        }
        if (await getHostSession()) {
          window.location.replace(safeReturnTo(params.get('returnTo')));
          return;
        }
      } catch (error) {
        setStatus(error.message, true);
      }
      if (!status.dataset.kind || status.dataset.kind !== 'error') {
        if (params.get('logout') === '1') setStatus('ログアウトしました。');
        else setStatus('ログインして収録ホストとして続行してください。');
      }
      loginButton.hidden = false;
      loginButton.addEventListener('click', async () => {
        loginButton.disabled = true;
        try {
          await client.loginWithRedirect({
            authorizationParams: { prompt: 'login' },
            appState: { returnTo: safeReturnTo(params.get('returnTo')) }
          });
        } catch (error) {
          setStatus(error.message, true);
          loginButton.disabled = false;
        }
      }, { once: true });
    }

    void initializeLogin();
  </script>
</body>
</html>
